<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bad Time Simulator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="Files/icon-32.png">
<style>
  :root { --ctl-opacity: 0.55; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Courier New", monospace; touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #game { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  .hidden { display: none !important; }

  /* touch controls */
  #controls { position: absolute; inset: 0; pointer-events: none; }
  .joy-base {
    position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.08); opacity: var(--ctl-opacity); box-sizing: border-box;
  }
  .joy-knob {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,0.85); opacity: var(--ctl-opacity);
    box-shadow: 0 0 0 3px rgba(0,0,0,0.5) inset;
  }
  .joy-dz { position: absolute; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.35); box-sizing: border-box; opacity: var(--ctl-opacity); }
  .btn {
    position: absolute; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: bold; color: #fff; opacity: var(--ctl-opacity); background: rgba(0,0,0,0.35);
  }
  .btn b { font-size: 1.6em; line-height: 1; }
  .btn small { font-size: 0.6em; margin-top: 2px; }
  .btn.z { border-color: #ff4040; }
  .btn.x { border-color: #ffd34a; }
  .btn.j { border-color: #3c7cff; }
  .btn.down { background: rgba(255,255,255,0.45); }
  .topbtn {
    position: absolute; top: 8px; width: 40px; height: 40px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.5); color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center;
    opacity: 0.7; pointer-events: auto; cursor: pointer;
  }

  /* panels */
  .panel {
    position: absolute; inset: 0; background: rgba(0,0,0,0.88); display: flex; align-items: center; justify-content: center;
    z-index: 10; touch-action: auto;
  }
  .panel .box {
    border: 4px solid #fff; padding: 18px 22px; max-width: 92vw; max-height: 88vh; overflow: auto; box-sizing: border-box;
    background: #000; text-align: center;
  }
  .panel h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: 2px; }
  .panel h2 { font-size: 22px; margin: 0 0 12px; }
  .panel p { margin: 8px 0; font-size: 15px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; text-align: left; }
  .row label { font-size: 16px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .seg button, .bigbtn {
    font-family: inherit; font-size: 15px; color: #fff; background: #000; border: 2px solid #888; padding: 8px 10px; cursor: pointer;
  }
  .seg button.on { border-color: #ff0; color: #ff0; }
  .bigbtn { font-size: 20px; padding: 12px 22px; border-color: #ff0; color: #ff0; margin-top: 12px; }
  #progress { width: 240px; height: 14px; border: 2px solid #fff; margin: 14px auto 0; }
  #progress div { height: 100%; width: 0; background: #ff0; }
  .heart { color: #f00; }
  @media (max-height: 420px) {
    .panel .box { padding: 10px 16px; }
    .panel h2 { margin-bottom: 4px; }
    .row { margin: 4px 0; }
    .seg button { padding: 5px 8px; }
    .bigbtn { margin-top: 6px; }
  }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>

<div id="controls" class="hidden">
  <div class="joy-base" id="joyBase"></div>
  <div class="joy-dz" id="joyDz"></div>
  <div class="joy-knob" id="joyKnob"></div>
  <div class="btn z" id="btnZ"><b>Z</b><small>OK</small></div>
  <div class="btn x" id="btnX"><b>X</b><small>BACK/SLOW</small></div>
  <div class="btn j" id="btnJ"><b>&#9650;</b><small>JUMP</small></div>
</div>
<div class="topbtn" id="btnSettings" style="right: 8px" title="Settings">&#9881;</div>
<div class="topbtn" id="btnFull" style="right: 56px" title="Fullscreen">&#x26F6;</div>

<div class="panel" id="startPanel">
  <div class="box">
    <h1><span class="heart">&#10084;</span> BAD TIME SIMULATOR</h1>
    <p id="loadText">Loading...</p>
    <div id="progress"><div></div></div>
    <button class="bigbtn hidden" id="startBtn">TAP TO START</button>
    <p style="font-size:13px;color:#aaa;margin-top:14px">Phone: left side = joystick, Z = confirm, X = back / move slowly,<br>JUMP = jump with the blue heart (hold for a higher jump).<br>
      Keyboard: arrows/WASD, Z/Enter, X/Shift, Space = jump.</p>
  </div>
</div>

<div class="panel hidden" id="settingsPanel">
  <div class="box">
    <h2>SETTINGS</h2>
    <div class="row"><label>Joystick size</label><div class="seg" data-key="joySize">
      <button data-v="s">Small</button><button data-v="m">Medium</button><button data-v="l">Large</button></div></div>
    <div class="row"><label>Joystick dead zone<br><small style="color:#aaa">(bigger = less sensitive)</small></label><div class="seg" data-key="deadzone">
      <button data-v="low">Small</button><button data-v="med">Medium</button><button data-v="high">Large</button></div></div>
    <div class="row"><label>Joystick position</label><div class="seg" data-key="joyMode">
      <button data-v="float">Where I touch</button><button data-v="fixed">Fixed</button></div></div>
    <div class="row"><label>Controls visibility</label><div class="seg" data-key="opacity">
      <button data-v="0.3">Faint</button><button data-v="0.55">Normal</button><button data-v="0.85">Strong</button></div></div>
    <div class="row"><label>Touch controls</label><div class="seg" data-key="showControls">
      <button data-v="auto">Auto</button><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    <div class="row"><label>Heart hitbox</label><div class="seg" data-key="hitbox">
      <button data-v="4">Undertale-like</button><button data-v="0">Old simulator</button></div></div>
    <button class="bigbtn" id="closeSettings">CLOSE</button>
  </div>
</div>

<div class="panel hidden" id="filePanel">
  <div class="box">
    <h2>LOAD CUSTOM ATTACK</h2>
    <p>Choose a .csv attack file.</p>
    <input type="file" id="filechooser" accept=".csv,text/csv,text/plain" style="font-size:16px;margin:10px 0">
    <br><button class="bigbtn" id="closeFile">CANCEL</button>
  </div>
</div>

<script src="web/engine.js"></script>
<script src="web/game.js"></script>
<script src="web/ui.js"></script>
</body>
</html>
